version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # เก็บข้อมูล PostgreSQL ไว้ในโฟลเดอร์ ./volumes/postgres_data
      - ./volumes/postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pos-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # เก็บการตั้งค่า pgAdmin ไว้ในโฟลเดอร์ ./volumes/pgadmin_data
      - ./volumes/pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
